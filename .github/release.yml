# Release-note categories use the labels assigned by pr-labels.yml.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
      - app/dependabot
      - app/github-actions
  categories:
    - title: Features
      labels:
        - feature
    - title: Fixes
      labels:
        - fix
    - title: Maintenance
      labels:
        - maintenance
    - title: Other Changes
      labels:
        - '*'
