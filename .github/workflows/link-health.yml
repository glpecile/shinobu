# Probes the provider URLs the app depends on (setup pages, OAuth/API
# endpoints) so a dead link is noticed days after it rots, not months later
# when a user hits it. Daily because the checks are time-driven — see
# scripts/check-external-urls.ts for the manifest and the Trakt precedent.
# Also runs on PRs that touch the provider layer, so a URL change is probed
# in the same PR that makes it. Note: the schedule only fires once this file
# is on the default branch.
name: Link health

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/check-external-urls.ts'
      - 'src/lib/providers/**'

# Read-only token: the probes fetch public URLs and need nothing but the source.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun check:links
