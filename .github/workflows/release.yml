# Otraku-style release channel (docs/plans/0021): tag `vX.Y.Z` builds signed
# Android APKs and attaches them to a GitHub Release; `workflow_dispatch` runs
# the same build unsigned (falls back to debug signing, KTD-2) and uploads
# the APKs as workflow artifacts instead of publishing — the agent-verifiable
# dry-run path (never creates a tag or release itself). No EAS, no paid
# services: plain `expo prebuild` + gradle on ubuntu runners (KTD-1).
# Build caches are read-only here and warmed from `main` by
# `android-warm.yml`: GitHub scopes caches per ref, so a tag run can never see
# another tag's cache (docs/solutions/android-ci-tag-cache-scoping.md).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Must match android-warm.yml exactly — CMake >= 3.17 initializes
      # CMAKE_<LANG>_COMPILER_LAUNCHER from these, routing the NDK C++ compile
      # (the dominant share of a cold build) through ccache (KTD-3).
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1.5G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Read expo.version
        id: version
        run: echo "value=$(bun -e "console.log(require('./app.json').expo.version)")" >> "$GITHUB_OUTPUT"

      # Tag runs only (R3) — workflow_dispatch has no tag to compare against.
      - name: Verify tag matches expo.version
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.ref_name }}" != "v${{ steps.version.outputs.value }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match expo.version ${{ steps.version.outputs.value }} (expected v${{ steps.version.outputs.value }})"
            exit 1
          fi

      # No keystore secret -> unsigned dry-run build (debug signing fallback,
      # R5). This is independent of trigger type: a tag push with no secret
      # configured yet also produces an -unsigned-debug build rather than
      # failing, so early tags before the owner runs the runbook (U5) still work.
      - name: Determine signing mode
        id: signing
        run: |
          if [ -n "${{ secrets.SHINOBU_KEYSTORE_BASE64 }}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "suffix=-unsigned-debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.signing.outputs.signed == 'true'
        run: echo "${{ secrets.SHINOBU_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Only set when signed — leaving these unset (rather than set-but-empty)
      # is what makes `plugins/with-release-signing.js`'s
      # `project.hasProperty(...)` fallback to debug signing actually fire.
      - name: Configure release signing properties
        if: steps.signing.outputs.signed == 'true'
        run: |
          {
            echo "ORG_GRADLE_PROJECT_SHINOBU_UPLOAD_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "ORG_GRADLE_PROJECT_SHINOBU_UPLOAD_STORE_PASSWORD=${{ secrets.SHINOBU_UPLOAD_STORE_PASSWORD }}"
            echo "ORG_GRADLE_PROJECT_SHINOBU_UPLOAD_KEY_ALIAS=${{ secrets.SHINOBU_UPLOAD_KEY_ALIAS }}"
            echo "ORG_GRADLE_PROJECT_SHINOBU_UPLOAD_KEY_PASSWORD=${{ secrets.SHINOBU_UPLOAD_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      # Builder-supplied provider credentials (AGENTS.md: TMDB is
      # "builder-supplied"; Trakt/AniList follow the same one-tap-connect
      # pattern) baked into the shipped APK via Expo's standard
      # EXPO_PUBLIC_* env handling — the same file Metro reads locally
      # (.env.local). Dynamic: every repo secret named EXPO_PUBLIC_* is
      # written, so adding a provider credential is a secrets-page change,
      # not a workflow edit. A missing secret writes no line, which every
      # consumer already treats as "ship without this credential" (falls
      # back to per-user guided setup, never a build failure).
      - name: Write provider credentials
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          jq -r 'to_entries[]
            | select(.key | startswith("EXPO_PUBLIC_"))
            | "\(.key)=\(.value)"' <<<"$ALL_SECRETS" > .env.local

      - name: Prebuild Android project
        run: bunx expo prebuild --platform android

      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          fi
          ccache --version

      # Restore-only: a save from a tag run is invisible to every future run
      # (per-ref cache scoping) and would only burn the 10 GB repo quota.
      # `android-warm.yml` is the sole writer. The run_id-suffixed key never
      # hits exactly; the prefix restore-keys pick up the warm entry.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-android-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.json') }}-
            ccache-android-${{ runner.os }}-

      - name: Reset ccache stats
        run: ccache -z

      # `cache-read-only: true` is explicit, not inherited from the default
      # (write-on-default-branch): workflow_dispatch dry-runs execute on `main`
      # *with* signing secrets in the environment, and the secretless warm
      # workflow must stay the only cache writer (KTD-1 integrity invariant).
      # `gradle-home-cache-strict-match` stays unset so entries written under
      # the warm workflow's job correlator are still restored here.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      # `--build-cache` reuses task outputs warmed on `main`; the daemon is left
      # running so the arm64 invocation below reuses it; the heap override
      # replaces the generated `-Xmx2048m` default. Flags, not edits to
      # `android/gradle.properties` — that file is CNG output (KTD-4).
      - name: Build universal release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --build-cache -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Print ccache stats
        if: always()
        run: ccache -s

      - name: Stage universal APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/shinobu-v${{ steps.version.outputs.value }}-universal${{ steps.signing.outputs.suffix }}.apk"

      - name: Build arm64-v8a release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --build-cache -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -PreactNativeArchitectures=arm64-v8a

      - name: Stage arm64-v8a APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/shinobu-v${{ steps.version.outputs.value }}-arm64-v8a${{ steps.signing.outputs.suffix }}.apk"

      - name: Checksum artifacts
        working-directory: dist
        run: for f in *.apk; do sha256sum "$f" > "$f.sha256"; done

      # workflow_dispatch never creates a tag or release (Goal Capsule stop
      # condition) — the dry-run path is inspecting these workflow artifacts.
      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: shinobu-dry-run-apks
          path: dist/*
          retention-days: 14

      - name: Create/update GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
