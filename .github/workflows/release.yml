# Tags publish Android APKs. Manual runs produce workflow artifacts. Restore build caches from android-warm.yml.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Match android-warm.yml so the build can reuse its cached outputs.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1.5G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Read expo.version
        id: version
        run: echo "value=$(bun -e "console.log(require('./app.json').expo.version)")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches expo.version
        if: github.event_name == 'push'
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.version.outputs.value }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match expo.version ${{ steps.version.outputs.value }} (expected v${{ steps.version.outputs.value }})"
            exit 1
          fi

      # A missing keystore uses debug signing, even on tag pushes.
      - name: Determine signing mode
        id: signing
        env:
          KEYSTORE: ${{ secrets.SHINOBU_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "suffix=-unsigned-debug" >> "$GITHUB_OUTPUT"
          fi

      # Expo embeds these public provider values in the APK. Keep the list aligned with .env.template.
      - name: Write provider credentials
        env:
          EXPO_PUBLIC_SIMKL_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_SIMKL_CLIENT_ID }}
          EXPO_PUBLIC_HARDCOVER_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_HARDCOVER_CLIENT_ID }}
          EXPO_PUBLIC_ANILIST_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_CLIENT_ID }}
          EXPO_PUBLIC_ANILIST_NATIVE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_ANILIST_NATIVE_CLIENT_ID }}
          EXPO_PUBLIC_TMDB_TOKEN: ${{ secrets.EXPO_PUBLIC_TMDB_TOKEN }}
        run: |
          : > .env.local
          for name in EXPO_PUBLIC_SIMKL_CLIENT_ID EXPO_PUBLIC_HARDCOVER_CLIENT_ID EXPO_PUBLIC_ANILIST_CLIENT_ID EXPO_PUBLIC_ANILIST_NATIVE_CLIENT_ID EXPO_PUBLIC_TMDB_TOKEN; do
            if [ -n "${!name}" ]; then printf '%s=%s\n' "$name" "${!name}" >> .env.local; fi
          done

      - name: Prebuild Android project
        run: bunx expo prebuild --platform android

      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          fi
          ccache --version

      # Only android-warm.yml writes this cache. Restore its latest entry by prefix.
      - name: Restore ccache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-android-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.json') }}-
            ccache-android-${{ runner.os }}-

      - name: Reset ccache stats
        run: ccache -z

      # Keep cache access read-only on manual runs too. They can sign APKs on main.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true

      # Expose signing material after dependency install, prebuild, and Gradle setup.
      - name: Decode release keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE: ${{ secrets.SHINOBU_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Leave signing properties unset for debug signing. The plugin checks hasProperty.
      - name: Configure release signing properties
        if: steps.signing.outputs.signed == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.SHINOBU_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SHINOBU_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SHINOBU_UPLOAD_KEY_PASSWORD }}
        run: |
          {
            echo "ORG_GRADLE_PROJECT_SHINOBU_UPLOAD_STORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "ORG_GRADLE_PROJECT_SHINOBU_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_SHINOBU_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "ORG_GRADLE_PROJECT_SHINOBU_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # Match the warm workflow build flags and reuse the Gradle daemon for arm64.
      - name: Build universal release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --build-cache -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Print ccache stats
        if: always()
        run: ccache -s

      - name: Stage universal APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/shinobu-v${{ steps.version.outputs.value }}-universal${{ steps.signing.outputs.suffix }}.apk"

      - name: Build arm64-v8a release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --build-cache -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -PreactNativeArchitectures=arm64-v8a

      - name: Stage arm64-v8a APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
            "dist/shinobu-v${{ steps.version.outputs.value }}-arm64-v8a${{ steps.signing.outputs.suffix }}.apk"

      - name: Checksum artifacts
        working-directory: dist
        run: for f in *.apk; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinobu-dry-run-apks
          path: dist/*
          retention-days: 14

      - name: Create/update GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --generate-notes
          fi
