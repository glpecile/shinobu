# Warm Android build caches on main so release tags can restore them.
# This secretless workflow is their only writer. Signed APK builds consume these
# caches as executable inputs (docs/solutions/android-ci-tag-cache-scoping.md).
name: Android Warm Cache

on:
  push:
    branches: [main]
    paths:
      - 'bun.lock'
      - 'package.json'
      - 'app.json'
      - 'plugins/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/android-warm.yml'
  # Run weekly to keep GitHub from evicting the warm cache.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: android-warm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 1.5G
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      # Keep the warm build secretless. Provider variables only affect the JS bundle.
      - name: Prebuild Android project
        run: bunx expo prebuild --platform android

      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ccache
          fi
          ccache --version

      # Use a fresh key so the cache action saves updated outputs after a prefix hit.
      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-android-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-${{ runner.os }}-${{ hashFiles('bun.lock', 'app.json') }}-
            ccache-android-${{ runner.os }}-

      # Reset after restore because CCACHE_DIR also holds stats from prior runs.
      - name: Reset ccache stats
        run: ccache -z

      # Use the same Gradle action as release.yml so both workflows share the cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Match release.yml so both builds share the Gradle task-output cache.
      - name: Build universal release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --build-cache -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Print ccache stats
        if: always()
        run: ccache -s
