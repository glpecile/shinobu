# Deterministic merge gate: lint, typecheck, unit tests. Network-dependent
# link health is deliberately NOT here — URL rot is time-driven, not
# diff-driven, and a flaky provider outage must not block unrelated merges.
# That lives in link-health.yml on a schedule.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun lint
      - run: bun typecheck
      - run: bun run test
